<!DOCTYPE html>
<html lang="en">
<head>

    <title>Volunteer Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .login-container {
            width: 350px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #ff4d6d;
            margin-bottom: 20px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-container input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-container button {
            width: 90%;
            padding: 10px;
            background-color: #ff4d6d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-container button:hover {
            background-color: #2a2a2a;
        }

        .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(42, 42, 42, 0.9); /* Semi-transparent background */
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      z-index: 1000;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .navbar .logo {
    display: flex;
    align-items: center;
    gap: 10px; /* Space between the logo image and text */
}

.navbar .logo .logo-image {
    width: 40px; /* Adjust width as needed */
    height: auto; /* Maintain aspect ratio */
    border-radius: 50%; /* Optional: make the logo circular */
}

    .navbar .nav-links {
      display: flex;
      gap: 20px;
      padding-right: 40px;
    }

    .navbar .nav-links button {
      background: none;
      border: none;
      color: white;
      font-size: 1em;
      cursor: pointer;
      padding: 10px 15px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .navbar .nav-links button img {
      width: 20px;
      height: 20px;
    }

    .navbar .nav-links button:hover {
      background-color: #555;
      transform: scale(1.1);
    }

    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
          <button onclick="goBack()" style="background-color: #ff4d6d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Go Back</button>
            <img src="website_logo.png" alt="Logo" class="logo-image">
            SurplusToServe
        </div>
        <div class="nav-links">
          <button onclick="location.href='about_us.php'">

          </button>

      </div>
    <!-- Login Form -->
    <div class="login-container">
        <h2>Volunteer Login</h2>
        <form action="volunteer_login.php" method="POST">
            <input type="email" name="email" placeholder="Gmail" required>
            <input type="text" name="volunteer_id" placeholder="Volunteer ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p>Don’t have an account? <a href="volunteer_signup.html">Signup here</a></p>
        </form>
    </div>
</body>
