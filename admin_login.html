<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(42, 42, 42, 0.9); /* Semi-transparent background */
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar .logo .logo-image {
            width: 40px;
            height: auto;
            border-radius: 50%;
        }

        .navbar .nav-links {
            display: flex;
            gap: 20px;
        }

        .navbar .nav-links button {
            background: none;
            border: none;
            color: white;
            font-size: 1em;
            cursor: pointer;
            padding: 10px 15px;
            padding-right: 35px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .navbar .nav-links button img {
            width: 20px;
            height: 20px;
        }

        .navbar .nav-links button:hover {
            background-color: #2a2a2a;
            transform: scale(1.1);
        }

        .login-container {
            padding: 20px;
            background-color: white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            width: 350px;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        .login-container h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
        }

        .login-container input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: box-shadow 0.3s ease;
        }

        .login-container input:focus {
            box-shadow: 0 0 8px #ff4d6d;
            outline: none;
        }

        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #ff4d6d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .login-container button:hover {
            background-color: #2a2a2a;
            transform: scale(1.05);
        }

        .login-container button:active {
            transform: scale(0.98);
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <button onclick="goBack()" style="background-color: #ff4d6d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Go Back</button>

            <img src="website_logo.png" alt="Logo" class="logo-image">
            SurplusToServe
        </div>
        <div class="nav-links">
            <button onclick="location.href='about_us.php'">
                <img src="about_us_icon.png" alt="About Us Icon"> 
            </button>
            <button onclick="location.href='contact_us.html'">
                <img src="contact_us_icon.png" alt="Contact Icon"> 
            </button>
            <button onclick="location.href='notifications.php'">
                <img src="bell_icon.png" alt="Notifications Icon"> 
            </button>
        </div>
    </div>
    <div class="login-container">
        <h2>Admin Login</h2>
        <form action="admin_login.php" method="POST">
            <input type="text" name="admin_id" placeholder="Admin ID" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
<script> 
    function goBack() {
    if (document.referrer !== "") {
        window.history.back();
    } else {
        window.location.href = "your-default-url.html"; // Replace with your fallback URL
    }
}

</script>
</html>
