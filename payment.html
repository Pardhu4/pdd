<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <style>
        /* CSS Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .payment-container {
            width: 40%;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            text-align: left;
        }

        input, select, button {
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .hidden {
            display: none;
        }

        .qr-code {
            width: 100px;
            height: 100px;
        }

        .payment-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>Payment Page</h1>
        <form id="payment-form" action="payment.php" method="POST">
            <!-- Donor ID Field (Newly Added) -->
            <label for="donor-id">Enter Donor ID:</label>
            <input type="text" id="donor-id" name="donor_id" placeholder="Enter Your Donor ID" required>

            <!-- Amount Field -->
            <label for="amount">Enter Amount (₹):</label>
            <input type="number" id="amount" name="amount" placeholder="Enter the amount" required>

            <!-- Payment Method Selection -->
            <label for="payment-method">Select Payment Method:</label>
            <select id="payment-method" name="payment_method" required>
                <option value="">-- Select --</option>
                <option value="upi">UPI ID</option>
                <option value="upi_number">UPI Number</option>
                <option value="qr_code">QR Code</option>
                <option value="debit_card">Debit Card</option>
                <option value="credit_card">Credit Card</option>
            </select>

            <!-- Dynamic Payment Details -->
            <div id="payment-details">
                <div class="payment-input" id="upi-input">
                    <label for="upi-id">Enter UPI ID:</label>
                    <input type="text" id="upi-id" name="upi_id">
                </div>
                <div class="payment-input" id="upi-number-input">
                    <label for="upi-number">Enter UPI Number:</label>
                    <input type="text" id="upi-number" name="upi_number">
                </div>
                <div class="payment-input" id="qr-code-input">
                    <label>Scan QR Code:</label>
                    <img src="qr_code_placeholder.jpg" alt="QR Code" class="qr-code">
                </div>
                <div class="payment-input" id="card-input">
                    <label for="card-number">Card Number:</label>
                    <input type="text" id="card-number" name="card_number">
                    <label for="expiry-date">Expiry Date:</label>
                    <input type="month" id="expiry-date" name="expiry_date">
                    <label for="cvv">CVV:</label>
                    <input type="text" id="cvv" name="cvv">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit">Make Payment</button>
        </form>

        <!-- Receipt Section -->
        <div id="receipt" class="hidden">
            <h2>Payment Receipt</h2>
            <p id="payment-status"></p>
            <p id="payment-reference"></p>
        </div>
    </div>

    <script>
        // JavaScript for Form Handling
        document.getElementById("payment-method").addEventListener("change", function () {
            const method = this.value;

            // Hide all payment input fields
            document.querySelectorAll(".payment-input").forEach(input => {
                input.style.display = "none";
            });

            // Show the selected method's input field
            if (method === "upi") {
                document.getElementById("upi-input").style.display = "block";
            } else if (method === "upi_number") {
                document.getElementById("upi-number-input").style.display = "block";
            } else if (method === "qr_code") {
                document.getElementById("qr-code-input").style.display = "block";
            } else if (method === "debit_card" || method === "credit_card") {
                document.getElementById("card-input").style.display = "block";
            }
        });
    </script>
</body>
</html>
