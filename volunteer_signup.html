    <style>
    body {

.container {

input[type="text"], input[type="email"], input[type="password"], input[type="tel"] {

button {

    color: white;

}

button:hover {
    background-color: #2a2a2a;
}
        .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(42, 42, 42, 0.9); /* Semi-transparent background */
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      z-index: 1000;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    h2 {
            text-align: center;
            color: #ff4d6d;
            margin-bottom: 20px;
        }
    .navbar .logo {
    display: flex;
    align-items: center;
    gap: 10px; /* Space between the logo image and text */
}

.navbar .logo .logo-image {
    width: 40px; /* Adjust width as needed */
    height: auto; /* Maintain aspect ratio */
    border-radius: 50%; /* Optional: make the logo circular */
}
    .navbar .nav-links {
      display: flex;
      gap: 20px;
      padding-right: 40px;
    }

    .navbar .nav-links button {
      background: none;
      border: none;
      color: white;
      font-size: 1em;
      cursor: pointer;
      padding: 10px 15px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .navbar .nav-links button img {
      width: 20px;
      height: 20px;
    }

    .navbar .nav-links button:hover {
      background-color: #555;
      transform: scale(1.1);
    }

    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
          <button onclick="goBack()" style="background-color: #ff4d6d; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Go Back</button>
            <img src="website_logo.png" alt="Logo" class="logo-image">
            SurplusToServe
        </div>
        <div class="nav-links">
          <button onclick="location.href='about_us.php'">

        <form id="signup-form" action="signup_volunteer.php" method="POST">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="tel" name="phone" placeholder="Contact Number (Optional)">
            <input type="text" name="address" placeholder="Address (Optional)">
            <button type="submit">Signup</button>
            <p>Don’t have an account? <a href="volunteer_login.html">Login here</a></p>
