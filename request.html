<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Request</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('volunteer_background.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(42, 42, 42, 0.9); /* Semi-transparent background */
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      z-index: 1000;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .navbar .logo {
    display: flex;
    align-items: center;
    gap: 10px; /* Space between the logo image and text */
}

.navbar .logo .logo-image {
    width: 40px; /* Adjust width as needed */
    height: auto; /* Maintain aspect ratio */
    border-radius: 50%; /* Optional: make the logo circular */
}

    .navbar .nav-links {
      display: flex;
      gap: 20px;
      padding-right: 35px;
    }

    .navbar .nav-links button {
      background: none;
      border: none;
      color: white;
      font-size: 1em;
      cursor: pointer;
      padding: 10px 15px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .navbar .nav-links button img {
      width: 20px;
      height: 20px;
    }

    .navbar .nav-links button:hover {
      background-color: #555;
      transform: scale(1.1);
    }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input, textarea, select, button {
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        textarea {
            resize: none;
        }

        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2a2a2a;
        }

        /* Popup */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .popup button {
            background-color: #d9534f;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="website_logo.png" alt="Logo" class="logo-image">
            SurplusToServe
        </div>
        <div class="nav-links">
          <button onclick="location.href='about_us.php'">
            <img src="about_us_icon.png" alt="About Us Icon">
          </button>
          <button onclick="location.href='contact_us.html'">
            <img src="contact_us_icon.png" alt="Contact Icon">
          </button>
          <button onclick="location.href='notifications.php'">
            <img src="bell_icon.png" alt="Notifications Icon">
          </button>
          <button onclick="location.href='track_request.html'">
            <img src="track.png" alt="Track Icon">
          </button>
          <button onclick="location.href='display_patners.php'">
            <img src="partners.png" alt="Patners Icon">
          </button>
        </div>
      </div>

    <div class="container">
        <h2>Organization Request</h2>
        <form id="org-request-form" action="request.php" method="POST" onsubmit="return handleFormSubmit(event)">
            <input type="text" name="org_name" placeholder="Organization Name" required>
            <input type="text" name="reg_number" placeholder="Registration Number" required>
            <input type="text" name="contact_person" placeholder="Contact Person" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <textarea name="address" placeholder="Address" required></textarea>
            <select name="request_type" required>
                <option value="food">Food</option>
                <option value="clothing">Clothing</option>
                <option value="funds">Funds</option>
                <option value="medication">Medication</option>
            </select>
            <textarea name="additional_details" placeholder="Additional Details (Optional)"></textarea>
            <button type="submit">Submit Request</button>
        </form>
    </div>

    <!-- Popup for Reference Number -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <h3>Your Unique Reference Number:</h3>
            <p id="reference-number"></p>
            <button onclick="closePopup()">Close</button>
        </div>
    </div>

    <script>
        function handleFormSubmit(event) {
            event.preventDefault(); // Prevent default form submission
            const form = document.getElementById("org-request-form");

            // Send form data using Fetch API
            fetch(form.action, {
                method: form.method,
                body: new FormData(form)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Display popup with unique reference number
                    document.getElementById("reference-number").textContent = data.reference_number;
                    document.getElementById("popup").style.display = "flex";
                } else {
                    alert("An error occurred. Please try again.");
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("An error occurred. Please try again.");
            });

            return false; // Prevent form from submitting the default way
        }

        function closePopup() {
            document.getElementById("popup").style.display = "none";
            window.location.href = "index.html"; // Redirect to the request page
        }
    </script>
</body>
</html>
