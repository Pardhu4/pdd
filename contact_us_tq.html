<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - SurplusToServe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        .header {
            background-color: #4CAF50; /* Green background */
            color: white;
            text-align: center;
            padding: 50px 0;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        .quote {
            text-align: center;
            font-size: 1.5em;
            margin: 20px 0;
            padding: 0 20px;
        }

        .thank-you-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }

        .thank-you-container p {
            font-size: 1.2em;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
        }

        .back-btn {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .back-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Thank You!</h1>
    </div>

    <div class="quote">
        <p>Thank you for contacting us! We will get back to you within 24-48hrs.</p>
     
    </div>

    <div class="thank-you-container">
        <p>We appreciate your interest and will respond as soon as possible. Your message is important to us, and
            we'll do our best to address your inquiry promptly.</p>
       <a href="index.html" class=" back-btn">Go Back to Home</a>
    </div>
</body>

</html>
